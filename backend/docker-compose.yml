version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fia
      POSTGRES_USER: fia
      POSTGRES_PASSWORD: fia_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fia -d fia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fia:fia_dev_only@postgres:5432/fia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-please
      ENV: dev
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fia:fia_dev_only@postgres:5432/fia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-please
      ENV: dev
    command: arq app.tasks.worker.WorkerSettings
    volumes:
      - .:/app

volumes:
  pgdata:
