[project]
name = "fia-backend"
version = "0.2.0"
description = "Financial Identity AI backend API"
requires-python = ">=3.11"
# Version pins are deliberately loose at the lower bound so the same
# pyproject resolves on Python 3.11 (with 0.29.x asyncpg) and Python 3.14
# (where you need newer wheels). Upper bounds keep us from pulling breaking
# majors automatically.
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.29.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "argon2-cffi>=23.1.0,<24.0",
    "python-multipart>=0.0.10,<1.0",
    "httpx>=0.27.0,<1.0",
    "structlog>=24.4.0,<25.0",
    "email-validator>=2.2.0,<3.0",
    "orjson>=3.10.0,<4.0",
    "neo4j>=5.20.0,<6.0",
    "anthropic>=0.39.0,<1.0",
    "sentry-sdk[fastapi]>=2.10.0,<3.0",
]
# NOTE: arq + redis removed — Vercel serverless has no background worker.
# The nightly recompute uses Vercel Cron + Upstash QStash instead.
# `httpx` is still here for Setu AA provider calls.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.5.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
